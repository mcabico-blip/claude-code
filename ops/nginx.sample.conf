# Reference nginx vhost for edge.ubi-as.com (server-side; keep the box copy in sync).
# Captures the PWA cache hardening Server Claude applied: immutable hashed assets,
# never-cache index.html/sw.js (prevents stale-login breakage after a rebuild),
# 404 on missing hashed asset rather than serving index.html.
server {
  listen 443 ssl http2;
  server_name edge.ubi-as.com;
  # ssl_certificate / ssl_certificate_key managed by certbot

  root /srv/ubi/apps/web/dist;
  index index.html;

  # API → NestJS (binds 127.0.0.1:8091)
  location /api/ { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  # Optional: instant-deploy webhook receiver (ops/webhook-receiver.mjs)
  location = /ubi-deploy-hook { proxy_pass http://127.0.0.1:8787; }

  # Hashed build assets are immutable; 404 (don't fall back to index) if missing.
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

  # The shell + service worker must never be cached, or users get a stale app
  # (and a broken login) after a rebuild.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /registerSW.js { add_header Cache-Control "no-cache"; }

  # SPA fallback for client-side routes.
  location / { try_files $uri /index.html; }
}
