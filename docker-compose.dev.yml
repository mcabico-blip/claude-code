# Local dev parity with the Lightsail box: Postgres + Redis as external
# endpoints (hard rule 6). The API itself runs with `npm run dev:api`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ubi
      POSTGRES_PASSWORD: ubi_dev
      POSTGRES_DB: ubi_suite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
